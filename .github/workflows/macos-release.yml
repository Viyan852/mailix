name: MAILIX macOS Universal Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-universal:
    name: MAILIX macOS Universal
    runs-on: macos-14

    steps:
      - name: Checkout MAILIX
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MAILIX version: $VERSION"

      # Run all normal tests except the old release-script tests.
      - name: Run core tests
        shell: bash
        run: |
          npm run test:unit
          npm run test:zero-node
          npm run test:icon
          npm run test:secrets
          npm run test:studio

      - name: Build macOS universal release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf dist

          node scripts/build-release.js \
            --platform=macos-universal \
            --out=dist

      - name: Verify release directory
        id: release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="dist/mailix-macos-universal-v${VERSION}"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "ERROR: Release directory was not created:"
            echo "$RELEASE_DIR"
            echo ""
            echo "dist contents:"
            find dist -maxdepth 5 -print || true
            exit 1
          fi

          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"

          echo "Release directory:"
          echo "$RELEASE_DIR"

      - name: Verify MAILIX.app
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"
          APP="$RELEASE_DIR/MAILIX.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: MAILIX.app is missing."
            exit 1
          fi

          echo "✓ MAILIX.app exists"

      - name: Verify bundled Node.js
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"
          NODE="$RELEASE_DIR/MAILIX.app/Contents/Resources/runtime/bin/node"

          echo "Checking bundled Node:"
          echo "$NODE"

          if [ ! -f "$NODE" ]; then
            echo "ERROR: Bundled Node.js runtime is missing."
            echo ""
            echo "Runtime directory:"
            find "$RELEASE_DIR/MAILIX.app/Contents/Resources/runtime" \
              -maxdepth 3 \
              -print 2>/dev/null || true
            exit 1
          fi

          chmod +x "$NODE"

          if [ ! -x "$NODE" ]; then
            echo "ERROR: Bundled Node.js is not executable."
            exit 1
          fi

          echo "✓ Bundled Node.js exists"

      - name: Verify universal Node binary
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"
          NODE="$RELEASE_DIR/MAILIX.app/Contents/Resources/runtime/bin/node"

          echo "Node binary architecture:"
          file "$NODE"

          echo ""
          echo "lipo information:"
          lipo -info "$NODE"

          INFO="$(lipo -info "$NODE")"

          if [[ "$INFO" != *"x86_64"* ]] || [[ "$INFO" != *"arm64"* ]]; then
            echo ""
            echo "ERROR: Node runtime is NOT universal."
            echo "Expected both x86_64 and arm64."
            exit 1
          fi

          echo ""
          echo "✓ Node.js runtime contains x86_64 + arm64"

      - name: Verify macOS launcher
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"
          LAUNCHER="$RELEASE_DIR/MAILIX.app/Contents/MacOS/MAILIX"

          if [ ! -f "$LAUNCHER" ]; then
            echo "ERROR: MAILIX launcher is missing."
            exit 1
          fi

          chmod +x "$LAUNCHER"

          if [ ! -x "$LAUNCHER" ]; then
            echo "ERROR: MAILIX launcher is not executable."
            exit 1
          fi

          echo "✓ MAILIX launcher exists"

      - name: Verify Info.plist
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"
          PLIST="$RELEASE_DIR/MAILIX.app/Contents/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist is missing."
            exit 1
          fi

          plutil -lint "$PLIST"

          echo "✓ Info.plist valid"

      - name: Verify app bundle
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"
          APP="$RELEASE_DIR/MAILIX.app"

          codesign --verify --deep --strict "$APP"

          echo "✓ MAILIX.app code signature verified"

      - name: Show final bundle
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"

          echo "========================================"
          echo "MAILIX macOS UNIVERSAL BUILD"
          echo "========================================"

          find "$RELEASE_DIR" -maxdepth 5 -print

          echo ""
          echo "Bundle size:"
          du -sh "$RELEASE_DIR"

      - name: Create release directory
        run: mkdir -p dist/releases

      - name: Create macOS universal ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="${{ steps.release.outputs.release_dir }}"

          OUTPUT="dist/releases/mailix-macos-universal-v${VERSION}.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$RELEASE_DIR" \
            "$OUTPUT"

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: ZIP was not created."
            exit 1
          fi

          echo "✓ Created:"
          echo "$OUTPUT"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cd dist/releases

          shasum -a 256 \
            "mailix-macos-universal-v${VERSION}.zip" \
            > SHA256SUMS

          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Final artifact verification
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          ZIP="dist/releases/mailix-macos-universal-v${VERSION}.zip"
          SUMS="dist/releases/SHA256SUMS"

          test -f "$ZIP"
          test -f "$SUMS"

          echo "========================================"
          echo "MAILIX macOS RELEASE READY"
          echo "========================================"
          echo ""
          ls -lh "$ZIP"
          ls -lh "$SUMS"
          echo ""
          cat "$SUMS"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailix-macos-universal
          path: |
            dist/releases/mailix-macos-universal-v*.zip
            dist/releases/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/mailix-macos-universal-v*.zip
            dist/releases/SHA256SUMS
          generate_release_notes: true
