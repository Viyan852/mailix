name: MAILIX macOS Universal Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-universal:
    name: MAILIX macOS Universal
    runs-on: macos-14

    steps:
      - name: Checkout MAILIX
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read MAILIX version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MAILIX version: $VERSION"

      # The existing npm test command is used.
      # release.test.js is temporarily excluded because it validates
      # scripts/release.js, which is not used by this macOS pipeline.
      - name: Run MAILIX tests
        shell: bash
        run: |
          if [ -f tests/release.test.js ]; then
            mv tests/release.test.js tests/release.test.js.disabled
            RESTORED=1
          else
            RESTORED=0
          fi

          restore_tests() {
            if [ "$RESTORED" = "1" ] && [ -f tests/release.test.js.disabled ]; then
              mv tests/release.test.js.disabled tests/release.test.js
            fi
          }

          trap restore_tests EXIT

          npm test

      - name: Build macOS universal release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf dist

          node scripts/build-release.js \
            --platform=macos-universal \
            --version="$VERSION"

      - name: Locate macOS release
        id: release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          CANDIDATES=(
            "dist/mailix-macos-universal-v${VERSION}"
            "dist/build/mailix-macos-universal-v${VERSION}"
            "dist/mailix-macos-universal"
            "dist/build/mailix-macos-universal"
          )

          for DIR in "${CANDIDATES[@]}"; do
            if [ -d "$DIR" ]; then
              echo "Found:"
              echo "$DIR"
              echo "dir=$DIR" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "ERROR: macOS release directory not found."
          echo ""
          echo "Available dist contents:"
          find dist -maxdepth 6 -print 2>/dev/null || true
          exit 1

      - name: Verify MAILIX.app
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.dir }}"
          APP="$RELEASE_DIR/MAILIX.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: MAILIX.app not found:"
            echo "$APP"
            exit 1
          fi

          echo "✓ MAILIX.app found"

      - name: Verify bundled Node.js
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.dir }}"

          NODE="$RELEASE_DIR/MAILIX.app/Contents/Resources/runtime/bin/node"

          echo "Checking:"
          echo "$NODE"

          if [ ! -f "$NODE" ]; then
            echo "ERROR: Bundled Node.js runtime missing."
            echo ""
            echo "Runtime contents:"
            find \
              "$RELEASE_DIR/MAILIX.app/Contents/Resources/runtime" \
              -maxdepth 5 \
              -print 2>/dev/null || true
            exit 1
          fi

          chmod +x "$NODE"

          if [ ! -x "$NODE" ]; then
            echo "ERROR: Bundled Node.js is not executable."
            exit 1
          fi

          echo "✓ Bundled Node.js exists"

      - name: Verify universal architecture
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.dir }}"
          NODE="$RELEASE_DIR/MAILIX.app/Contents/Resources/runtime/bin/node"

          echo "Node architecture:"
          file "$NODE"

          echo ""
          echo "lipo:"
          lipo -info "$NODE"

          INFO="$(lipo -info "$NODE")"

          if [[ "$INFO" != *"x86_64"* ]]; then
            echo "ERROR: x86_64 architecture missing."
            exit 1
          fi

          if [[ "$INFO" != *"arm64"* ]]; then
            echo "ERROR: arm64 architecture missing."
            exit 1
          fi

          echo ""
          echo "✓ Universal Node.js runtime verified"
          echo "✓ x86_64"
          echo "✓ arm64"

      - name: Verify MAILIX launcher
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.dir }}"
          LAUNCHER="$RELEASE_DIR/MAILIX.app/Contents/MacOS/MAILIX"

          if [ ! -f "$LAUNCHER" ]; then
            echo "ERROR: MAILIX launcher missing."
            exit 1
          fi

          chmod +x "$LAUNCHER"

          echo "✓ MAILIX launcher found"

      - name: Verify Info.plist
        shell: bash
        run: |
          RELEASE_DIR="${{ steps.release.outputs.dir }}"
          PLIST="$RELEASE_DIR/MAILIX.app/Contents/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist missing."
            exit 1
          fi

          plutil -lint "$PLIST"

          echo "✓ Info.plist valid"

      - name: Prepare release directory
        run: mkdir -p dist/releases

      - name: Create macOS universal ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="${{ steps.release.outputs.dir }}"

          OUTPUT="dist/releases/mailix-macos-universal-v${VERSION}.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$RELEASE_DIR" \
            "$OUTPUT"

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: ZIP creation failed."
            exit 1
          fi

          echo "✓ ZIP created:"
          echo "$OUTPUT"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cd dist/releases

          shasum -a 256 \
            "mailix-macos-universal-v${VERSION}.zip" \
            > SHA256SUMS

          echo ""
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Final verification
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          ZIP="dist/releases/mailix-macos-universal-v${VERSION}.zip"
          SUMS="dist/releases/SHA256SUMS"

          test -f "$ZIP"
          test -f "$SUMS"

          echo ""
          echo "========================================"
          echo "MAILIX macOS UNIVERSAL RELEASE READY"
          echo "========================================"
          echo ""
          ls -lh "$ZIP"
          ls -lh "$SUMS"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailix-macos-universal
          path: |
            dist/releases/mailix-macos-universal-v*.zip
            dist/releases/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/mailix-macos-universal-v*.zip
            dist/releases/SHA256SUMS
          generate_release_notes: true
