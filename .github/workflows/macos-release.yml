```yaml
name: MAILIX macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build release
        run: node scripts/release.js

      - name: Show build output
        run: |
          echo "Build output:"
          find dist -maxdepth 4 -type f | sort

      - name: Package macOS builds
        run: |
          mkdir -p release

          if [ -d "dist/build/mailix-macos-universal" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/build/mailix-macos-universal" \
              "release/mailix-macos-universal.zip"
          elif [ -d "dist/mailix-macos-universal" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/mailix-macos-universal" \
              "release/mailix-macos-universal.zip"
          else
            echo "ERROR: macOS build was not created."
            exit 1
          fi

          shasum -a 256 release/*.zip > release/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailix-macos-release
          path: release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MAILIX ${{ github.ref_name }} — macOS Release
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.zip
            release/*.txt
```
