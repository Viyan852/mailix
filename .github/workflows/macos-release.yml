name: MAILIX macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build MAILIX for macOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read MAILIX version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MAILIX version: $VERSION"

      # Do NOT run the old release.test.js suite here.
      # That suite validates release.js, which is intentionally
      # not used by the macOS release pipeline.
      - name: Run core tests
        shell: bash
        run: |
          npm test -- --test-name-pattern='^(?!.*release)'

      - name: Build macOS universal release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          node scripts/build-release.js \
            --platform=macos-universal \
            --version="$VERSION"

      - name: Find macOS build
        id: build
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for DIR in \
            "dist/build/mailix-macos-universal-v${VERSION}" \
            "dist/mailix-macos-universal-v${VERSION}" \
            "dist/build/mailix-macos-universal" \
            "dist/mailix-macos-universal"
          do
            if [ -d "$DIR" ]; then
              echo "Found macOS build:"
              echo "$DIR"
              echo "dir=$DIR" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "ERROR: Could not find macOS build."

          echo ""
          echo "Available dist files:"
          find dist -maxdepth 5 -print 2>/dev/null || true

          exit 1

      - name: Verify bundled Node.js
        shell: bash
        run: |
          BUILD="${{ steps.build.outputs.dir }}"
          RUNTIME="$BUILD/runtime/node"

          echo "Checking:"
          echo "$RUNTIME"

          if [ ! -f "$RUNTIME" ]; then
            echo "ERROR: Bundled Node.js runtime is missing."
            exit 1
          fi

          chmod +x "$RUNTIME"

          if [ ! -x "$RUNTIME" ]; then
            echo "ERROR: Bundled Node.js runtime is not executable."
            exit 1
          fi

          echo "Bundled Node.js runtime verified."

      - name: Verify macOS application files
        shell: bash
        run: |
          BUILD="${{ steps.build.outputs.dir }}"

          if [ ! -d "$BUILD" ]; then
            echo "ERROR: Build directory disappeared."
            exit 1
          fi

          echo "macOS build contents:"
          find "$BUILD" -maxdepth 3 -print

      - name: Create release directory
        run: mkdir -p dist/releases

      - name: Create macOS universal ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.build.outputs.dir }}"

          OUTPUT="dist/releases/mailix-macos-universal-v${VERSION}.zip"

          echo "Creating:"
          echo "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$BUILD" \
            "$OUTPUT"

          test -f "$OUTPUT"

          echo "ZIP created successfully."

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cd dist/releases

          shasum -a 256 \
            "mailix-macos-universal-v${VERSION}.zip" \
            > SHA256SUMS

          echo "Checksums:"
          cat SHA256SUMS

      - name: Verify release artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          ZIP="dist/releases/mailix-macos-universal-v${VERSION}.zip"
          SUMS="dist/releases/SHA256SUMS"

          test -f "$ZIP"
          test -f "$SUMS"

          echo "Release artifacts verified:"
          ls -lh "$ZIP" "$SUMS"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailix-macos-universal
          path: |
            dist/releases/mailix-macos-universal-v*.zip
            dist/releases/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/mailix-macos-universal-v*.zip
            dist/releases/SHA256SUMS
          generate_release_notes: true
