```yaml
name: MAILIX macOS Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Checkout MAILIX
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build MAILIX macOS package
        env:
          MAILIX_TARGET: macos-${{ matrix.arch }}
        run: |
          node scripts/release.js

      - name: Locate macOS build
        run: |
          echo "=== dist ==="
          find dist -maxdepth 4 -type f | sort || true

      - name: Package macOS release
        run: |
          mkdir -p release

          if [ -d "dist/build/mailix-macos-${{ matrix.arch }}" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/build/mailix-macos-${{ matrix.arch }}" \
              "release/mailix-macos-${{ matrix.arch }}.zip"
          elif [ -d "dist/mailix-macos-${{ matrix.arch }}" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/mailix-macos-${{ matrix.arch }}" \
              "release/mailix-macos-${{ matrix.arch }}.zip"
          else
            echo "ERROR: macOS build directory was not found."
            exit 1
          fi

      - name: Generate SHA256
        run: |
          cd release
          shasum -a 256 *.zip > SHA256SUMS-${{ matrix.arch }}.txt
          cat SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailix-macos-${{ matrix.arch }}
          path: release/*

  release:
    name: Publish macOS Release
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mailix-macos-x64
          path: release

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mailix-macos-arm64
          path: release

      - name: List release files
        run: |
          echo "=== Release files ==="
          find release -type f -maxdepth 2 -print

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MAILIX ${{ github.ref_name }} — macOS Release
          generate_release_notes: false
          files: |
            release/*.zip
            release/*.txt
```
